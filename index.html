<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منتدى صفاء الروح - النسخة النهائية الذهبية ✨</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK v9 Compat (متوافق مع Sketchware) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
    
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-secondary: #C5A028;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --dark-bg: #0A0A0A;
            --dark-card: #141414;
            --dark-border: #1F1F1F;
            --text-white: #F5F5F5;
            --text-gold: #D4AF37;
            --accent-blue: #3b82f6;
            --female-pink: #ec4899;
            --male-white: #F5F5F5;
            --success: #22c55e;
            --error: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            margin: 0;
            padding-bottom: 70px;
            overflow-x: hidden;
            min-height: 100vh;
            line-height: 1.5;
        }
                .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .gold-btn {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 10px 24px;
        }
        .gold-btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 5px 20px rgba(212,175,55,0.4); }
        .gold-btn:active { transform: translateY(0) scale(0.98); }
        .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .post-card {
            background-color: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 16px;
            margin-bottom: 16px;
            transition: border 0.3s, transform 0.2s, box-shadow 0.2s;
            padding: 16px;
        }
        .post-card:hover { 
            border-color: var(--gold-primary); 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .top-nav {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dark-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 0;
        }
        
        .bottom-nav {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--dark-border);            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 100vw;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }
        
        .nav-item {
            color: #888;
            font-size: 1.25rem;
            transition: all 0.2s ease;
            cursor: pointer;
            background: none;
            border: none;
            position: relative;
            padding: 8px 12px;
            border-radius: 10px;
        }
        .nav-item.active { color: var(--gold-primary); background: rgba(212,175,55,0.1); }
        .nav-item:active { transform: scale(0.95); }
        
        .profile-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold-primary);
            color: var(--gold-primary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .profile-icon:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        .verified-badge { color: var(--accent-blue); font-size: 0.9rem; margin-right: 4px; }
        
        .modal {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1000;
            display: flex;
            align-items: center;            justify-content: center;
            padding: 20px;
        }
        .modal.hidden { display: none; }
        
        .modal-content {
            background: var(--dark-card);
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            width: 100%;
            max-width: 580px;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .input-field {
            width: 100%;
            background: #000;
            border: 1px solid var(--dark-border);
            border-radius: 12px;
            padding: 14px;
            color: white;
            margin-bottom: 16px;
            font-family: 'Tajawal', sans-serif;
            text-align: right;
            font-size: 1rem;
            transition: border 0.2s;
        }
        .input-field:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 0 3px rgba(212,175,55,0.2); }
        
        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--error);
            color: white;
            font-size: 0.65rem;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            padding: 0 4px;
            border: 2px solid var(--dark-bg);
        }
                .admin-card {
            background: #1a1a1a;
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 20px;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-secondary); }
        
        .trending-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .pinned-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .male-name { color: var(--male-white); font-weight: 600; }
        .female-name { color: var(--female-pink); font-weight: 600; }
        
        .comment-reply {
            margin-right: 24px;
            border-right: 2px solid var(--gold-primary);
            padding-right: 12px;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gold-primary);            font-size: 1.1rem;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            font-size: 1rem;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease forwards; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse { animation: pulse 2s infinite; }
        
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 3000;
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 2.3s forwards;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        
        @keyframes slideDown { from { top: -60px; opacity: 0; } to { top: 24px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(-15px); } }
        
        .copy-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .copy-btn:hover { color: var(--gold-primary) !important; transform: scale(1.1); }
        .copy-btn:active { transform: scale(0.95); }
        
        .show-more-btn {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 12px;
        }
        .show-more-btn:hover { background: rgba(212, 175, 55, 0.2); }
        
        .clickable-username {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .clickable-username:hover { text-decoration: underline; }
        
        .admin-only { display: none; }
        .mod-only { display: none; }
        body.admin-mode .admin-only { display: inline-flex !important; }
        body.admin-mode .mod-only { display: inline-flex !important; }
        body.mod-mode .mod-only { display: inline-flex !important; }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold gold-text">✨ صفاء الروح</h1>
            <div class="relative">
                <input type="text" id="global-search-input" class="input-field mb-0 w-40 text-xs" placeholder="ابحث..." onkeyup="handleGlobalSearch(this.value)">
                <div id="search-results-dropdown" class="hidden absolute top-full left-0 right-0 bg-zinc-900 border border-zinc-800 rounded-lg mt-1 z-50 max-h-60 overflow-y-auto">
                    <div id="search-results-content" class="p-2"></div>
                </div>
            </div>
            <button id="notif-btn" class="nav-item relative" onclick="showPage('notifications')">
                <i class="fa-solid fa-bell"></i>
                <span id="notif-count" class="notification-badge hidden">0</span>
            </button>
        </div>
    </div>
    
    <div class="max-w-3xl mx-auto px-4 py-6" id="main-content">
        <div class="loading">جاري التحميل...</div>
    </div>
    
    <div class="bottom-nav">
        <button id="nav-home" class="nav-item active" onclick="showPage('home')" title="الرئيسية"><i class="fa-solid fa-house"></i></button>
        <button id="nav-trending" class="nav-item" onclick="showPage('trending')" title="الرائج"><i class="fa-solid fa-fire"></i></button>
        <button id="nav-compose" class="nav-item" onclick="openCreatePostModal()" title="منشور جديد"><i class="fa-solid fa-feather"></i></button>
        <button id="nav-profile" class="nav-item" onclick="showPage('profile')" title="الملف الشخصي"><i class="fa-solid fa-user"></i></button>        <button id="nav-admin" class="nav-item admin-only mod-only" onclick="showPage('admin')" title="لوحة التحكم"><i class="fa-solid fa-shield-halved"></i></button>
    </div>
    
    <div id="modal-container" class="modal hidden">
        <div class="modal-content" id="modal-body"></div>
    </div>
    
    <script>
        // ⚙️ إعدادات النظام الأساسية
        const ADMIN_EMAIL = 'a1sabriweb@gmail.com';
        
        let currentUser = null;
        let currentView = 'home';
        let currentPostId = null;
        let commentsPageState = {};
        
        // ✅ إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBsZc0MRl8jfmMLEPp2zm_nftOs82KUbZ8",
            authDomain: "safaa-forum.firebaseapp.com",
            databaseURL: "https://safaa-forum-default-rtdb.firebaseio.com",
            projectId: "safaa-forum",
            storageBucket: "safaa-forum.firebasestorage.app",
            messagingSenderId: "656750701351",
            appId: "1:656750701351:web:e56a2a792eb6f49f251702",
            measurementId: "G-63WL44W9RF"
        };
        
        // ✅ تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const analytics = firebase.analytics();
        
        // ✅ دالة التحقق من الصلاحيات
        function hasPermission(action, targetEmail = null) {
            if (!currentUser) return false;
            const isAdmin = currentUser.email === ADMIN_EMAIL;
            const isMod = currentUser.role === 'moderator';
            const isOwner = targetEmail && currentUser.email === targetEmail;
            
            switch(action) {
                case 'delete_any': return isAdmin || isMod;
                case 'delete_own': return isOwner;
                case 'verify_user': return isAdmin;
                case 'assign_mod': return isAdmin;
                case 'ban_user': return isAdmin;                case 'pin_post': return isAdmin;
                case 'view_admin_panel': return isAdmin || isMod;
                case 'dismiss_report': return isAdmin || isMod;
                default: return false;
            }
        }
        
        // ✅ التحقق من حالة المصادقة
        auth.onAuthStateChanged(async (user) => {
            console.log("Auth state changed:", user ? user.email : "null");
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.email).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        if (userData.isBanned) { 
                            await auth.signOut(); 
                            showToast("🚫 تم حظر حسابك", 'error'); 
                            return; 
                        }
                        currentUser = {...userData, email: user.email};
                        console.log("User loaded:", currentUser.username, "Role:", currentUser.role);
                        
                        document.body.classList.remove('admin-mode', 'mod-mode');
                        if (currentUser.email === ADMIN_EMAIL) {
                            document.body.classList.add('admin-mode');
                        } else if (currentUser.role === 'moderator') {
                            document.body.classList.add('mod-mode');
                        }
                        
                        showPage('home');
                        updateNotifBadge();
                    } else {
                        console.log("User document not found, creating...");
                        await db.collection('users').doc(user.email).set({
                            username: user.displayName || user.email.split('@')[0],
                            email: user.email,
                            uia: Math.floor(1000+Math.random()*9000).toString(),
                            verified: false, 
                            role: 'member', 
                            gender: 'male',
                            age: '', 
                            country: '',
                            joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            isBanned: false, 
                            followingCount: 0, 
                            followersCount: 0
                        });
                        currentUser = {
                            username: user.displayName || user.email.split('@')[0],                            email: user.email,
                            uia: Math.floor(1000+Math.random()*9000).toString(),
                            verified: false, 
                            role: 'member', 
                            gender: 'male',
                            age: '', 
                            country: '',
                            isBanned: false
                        };
                        showPage('home');
                        updateNotifBadge();
                    }
                } catch (error) {
                    console.error("Error loading user:", error);
                    showToast("خطأ في تحميل البيانات: " + error.message, 'error');
                }
            } else { 
                console.log("No user, showing auth page");
                currentUser = null;
                document.body.classList.remove('admin-mode', 'mod-mode');
                showAuthPage(); 
            }
        });
        
        function showAuthPage() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = `
                <div class="max-w-md mx-auto mt-20 text-center animate-fade">
                    <h2 class="text-3xl font-bold gold-text mb-8">✨ صفاء الروح</h2>
                    <div class="space-y-4">
                        <button onclick="showLoginForm()" class="gold-btn w-full py-3 rounded-lg">دخول</button>
                        <button onclick="showRegisterForm()" class="w-full py-3 rounded-lg border border-gold-primary text-gold-primary font-bold hover:bg-gold-primary/10">تسجيل جديد</button>
                    </div>
                </div>`;
        }
        
        function showLoginForm() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = `
                <div class="max-w-md mx-auto mt-20 animate-fade">
                    <h2 class="text-2xl font-bold gold-text mb-6 text-center">دخول</h2>
                    <div class="space-y-4">
                        <input type="email" id="login-email" class="input-field" placeholder="البريد الإلكتروني">
                        <input type="password" id="login-pass" class="input-field" placeholder="كلمة المرور">
                        <button onclick="login()" class="gold-btn w-full py-3 rounded-lg">دخول</button>
                        <button onclick="showAuthPage()" class="text-gold-primary text-sm underline w-full">العودة</button>
                    </div>
                </div>`;        }
        
        function showRegisterForm() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = `
                <div class="max-w-md mx-auto mt-20 animate-fade">
                    <h2 class="text-2xl font-bold gold-text mb-6 text-center">تسجيل جديد</h2>
                    <div class="space-y-4">
                        <input type="text" id="reg-name" class="input-field" placeholder="اسم المستخدم" maxlength="30">
                        <input type="email" id="reg-email" class="input-field" placeholder="البريد الإلكتروني">
                        <input type="password" id="reg-pass" class="input-field" placeholder="كلمة المرور">
                        <select id="reg-gender" class="input-field mb-0">
                            <option value="male">ذكر ♂</option>
                            <option value="female">أنثى ♀</option>
                        </select>
                        <button onclick="register()" class="gold-btn w-full py-3 rounded-lg">تسجيل</button>
                        <button onclick="showAuthPage()" class="text-gold-primary text-sm underline w-full">العودة</button>
                    </div>
                </div>`;
        }
        
        async function login() {
            const email = document.getElementById('login-email')?.value;
            const pass = document.getElementById('login-pass')?.value;
            if (!email || !pass) return showToast("املأ جميع الحقول", 'error');
            try {
                console.log("Attempting login for:", email);
                await auth.signInWithEmailAndPassword(email, pass);
                showToast("✅ تم الدخول!");
            } catch(e) { 
                console.error("Login error:", e);
                showToast("خطأ: "+e.message, 'error'); 
            }
        }
        
        async function register() {
            const name = document.getElementById('reg-name')?.value;
            const email = document.getElementById('reg-email')?.value;
            const pass = document.getElementById('reg-pass')?.value;
            const gender = document.getElementById('reg-gender')?.value || 'male';
            
            if (!name || !email || !pass) return showToast("املأ جميع الحقول", 'error');
            if (pass.length < 6) return showToast("كلمة المرور 6 أحرف على الأقل", 'error');
            
            try {
                console.log("Attempting registration for:", email);
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                await db.collection('users').doc(email).set({
                    username: name,                     email,
                    uia: Math.floor(1000+Math.random()*9000).toString(),
                    verified: false, 
                    role: 'member', 
                    gender,
                    age: '', 
                    country: '',
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isBanned: false, 
                    followingCount: 0, 
                    followersCount: 0
                });
                showToast("✅ تم التسجيل! يمكنك الدخول الآن.");
                showAuthPage();
            } catch(e) { 
                console.error("Registration error:", e);
                showToast("خطأ: "+e.message, 'error'); 
            }
        }
        
        function logout() { 
            auth.signOut(); 
            currentUser = null; 
            document.body.classList.remove('admin-mode', 'mod-mode');
            showToast("✅ تم الخروج"); 
            showAuthPage(); 
        }
        
        function showPage(page) {
            currentView = page;
            const main = document.getElementById('main-content');
            if (!main) return;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-'+page)?.classList.add('active');
            document.getElementById('global-search-input').value = '';
            document.getElementById('search-results-dropdown')?.classList.add('hidden');
            
            switch(page) {
                case 'home': renderHome(); break;
                case 'trending': renderTrending(); break;
                case 'profile': currentUser ? renderProfile(currentUser.email) : showAuthPage(); break;
                case 'admin': 
                    if (hasPermission('view_admin_panel')) renderAdminPanel();
                    else { showPage('home'); showToast("غير مصرح", 'error'); }
                    break;
                case 'notifications': currentUser ? renderNotifications() : showAuthPage(); break;
            }
        }
        
        function renderHome() {            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = `<div class="mb-4"><h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-house text-gold-primary"></i>آخر المتابعات</h2><div id="posts-container" class="space-y-4"><div class="loading">جاري التحميل...</div></div></div>`;
            
            db.collection('posts').orderBy('timestamp','desc').limit(50).onSnapshot(async (snap) => {
                const container = document.getElementById('posts-container');
                if (!container) return;
                if (snap.empty) { container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i><br>لا توجد منشورات حالياً.<br>كن أول من ينشر! ✨</div>'; return; }
                const posts = [];
                for (const doc of snap.docs) {
                    try {
                        const data = doc.data();
                        const u = await db.collection('users').doc(data.authorEmail).get();
                        posts.push({ id: doc.id, ...data, author: u.exists ? u.data() : {username:"عضو",verified:false,gender:'male'} });
                    } catch(e) { console.error('Load post error:', e); }
                }

            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = `<div class="mb-4"><h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-fire text-orange-500"></i>المحتوى الرائج</h2><div id="trending-container" class="space-y-4"><div class="loading">جاري الحساب...</div></div></div>`;
            
            db.collection('posts').get().then(async (snap) => {
                const container = document.getElementById('trending-container');
                if (!container) return;
                if (snap.empty) { container.innerHTML = '<div class="empty-state">لا توجد منشورات كافية</div>'; return; }
                const posts = [];
                for (const doc of snap.docs) {
                    try {
                        const data = doc.data();
                        const u = await db.collection('users').doc(data.authorEmail).get();
                        const author = u.exists ? u.data() : {username:"عضو",verified:false,gender:'male'};
                        posts.push({ id: doc.id, ...data, author, _score: calculateTrendingScore({...data,id:doc.id}, author) });
                    } catch(e) { console.error('Trending error:', e); }
                }
                posts.sort((a,b)=>b._score-a._score);
                renderPosts(posts.slice(0,30), 'trending-container', true);
            }).catch(err => {
                console.error('Trending fetch error:', err);
                document.getElementById('trending-container').innerHTML = '<div class="text-center text-red-500 py-10">خطأ</div>';
            });

                function calculateTrendingScore(post, author) {
            const likes = (post.likes?.length || 0);
            const comments = (post.commentsCount || 0);
            const isVerified = author?.verified || false;
            const isPinned = post.isPinned || false;
            
            let baseScore;
            if (isVerified) {
                baseScore = (likes * 0.5) + (comments * 0.5);
            } else {
                baseScore = (likes * 0.8) + (comments * 0.2);
            }
            
            const ageHours = (Date.now() - (post.timestamp?.toMillis?.() || 0)) / (1000 * 60 * 60);
            const decay = Math.pow(ageHours + 1, 1.2);
            const pinnedBonus = isPinned ? 10000 : 0;
            
            return (baseScore / decay) + pinnedBonus;
        }

        function escapeHtml(text) {

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate?.() || new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (seconds < 60) return 'الآن';            if (minutes < 60) return `قبل ${minutes} د`;
            if (hours < 24) return `قبل ${hours} س`;
            if (days < 7) return `قبل ${days} ي`;
            return date.toLocaleDateString('ar-SA');
        }
        
        function formatNumber(num) {
            if (!num) return '0';

            if (num >= 1000) return (num / 1000).toFixed(1) + 'ك';
            return num.toString();
        }

        // ✅ دالة الإعجاب المصححة - تستخدم arrayUnion/arrayRemove لمنع اختفاء اللايك
        async function toggleLike(postId) {
            if (!currentUser) return showToast("سجل الدخول أولاً", 'error');
            
            try {
                const postRef = db.collection('posts').doc(postId);
                const postDoc = await postRef.get();
                
                if (!postDoc.exists) {
                    return showToast("المنشور غير موجود", 'error');
                }
                
                const postData = postDoc.data();
                const likes = postData.likes || [];
                const hasLiked = likes.includes(currentUser.email);
                
                if (hasLiked) {
                    // ✅ إزالة الإعجاب باستخدام arrayRemove (عملية ذرية آمنة)
                    await postRef.update({
                        likes: firebase.firestore.FieldValue.arrayRemove(currentUser.email)
                    });
                    showToast("تم إزالة الإعجاب");
                } else {
                    // ✅ إضافة الإعجاب باستخدام arrayUnion (عملية ذرية آمنة)
                    await postRef.update({
                        likes: firebase.firestore.FieldValue.arrayUnion(currentUser.email)
                    });                    
                    // إرسال إشعار لصاحب المنشور
                    const authorEmail = postData.authorEmail;
                    if (authorEmail && authorEmail !== currentUser.email) {
                        await addNotification(authorEmail, `${currentUser.username} أعجب بمنشورك ❤️`, 'like', postId);
                    }
                    showToast("✅ أعجبك المنشور");
                }
                
                // تحديث الواجهة فوراً
                refreshCurrentView();
                
            } catch (error) {
                console.error('Like error:', error);
                showToast("❌ خطأ: " + error.message, 'error');
            }
        }

        // ✅ دالة حذف التعليق
        async function deleteComment(commentId, postId) {

            try {

        async function backupData() {
            showToast("🔄 جاري إنشاء نسخة احتياطية...");
            try {
                const users = await db.collection('users').get();
                const posts = await db.collection('posts').get();
                const comments = await db.collection('comments').get();
                
                const backup = {
                    timestamp: new Date().toISOString(),
                    users: users.docs.map(d => ({id:d.id, ...d.data()})),
                    posts: posts.docs.map(d => ({id:d.id, ...d.data()})),
                    comments: comments.docs.map(d => ({id:d.id, ...d.data()}))
                };
                
                const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `safaa-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("✅ تم تحميل النسخة الاحتياطية");
            } catch(e) {
                showToast("خطأ: "+e.message, 'error');
            }
        }
        
        async function clearOldPosts() {
            if (!confirm("⚠️ هل تريد حذف المنشورات الأقدم من 90 يوماً؟")) return;
            try {
                const cutoff = Date.now() - (90 * 24 * 60 * 60 * 1000);                const posts = await db.collection('posts').get();
                let deleted = 0;
                const batch = db.batch();
                
                posts.forEach(doc => {
                    const ts = doc.data().timestamp?.toMillis?.() || 0;
                    if (ts < cutoff && !doc.data().isPinned) {
                        batch.delete(doc.ref);
                        deleted++;
                    }
                });
                
                if (deleted > 0) {
                    await batch.commit();
                    showToast(`✅ تم حذف ${deleted} منشور قديم`);
                } else {
                    showToast("لا توجد منشورات قديمة للحذف");
                }
            } catch(e) {
                showToast("خطأ: "+e.message, 'error');
            }
        }

                    if (d.content?.toLowerCase().includes(query.toLowerCase()))

        function refreshCurrentView() {
            if (currentView === 'home') renderHome();
            else if (currentView === 'trending') renderTrending();
            else if (currentView === 'profile' && currentUser) renderProfile(currentUser.email);
        }
        
        document.addEventListener('DOMContentLoaded', ()=>{ /* Auth handles init */ });
        setInterval(updateNotifBadge, 30000);
        
        document.addEventListener('backbutton', function(e) {
            const modal = document.getElementById('modal-container');
            if (modal && !modal.classList.contains('hidden')) { 
                e.preventDefault(); 
                closeModal(); 
                return; 
            }
        }, false);
    </script>
</body>
</html>

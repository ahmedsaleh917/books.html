<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتدى تحت الصيانة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .maintenance-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 60px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .footer-note {
            font-size: 14px;
            color: #bdc3c7;
            border-top: 1px solid #ededed;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- أيقونة الصيانة (يمكنك تغييرها) -->
        <div class="icon">🛠️</div>
        
        <h1>المنتدى تحت الصيانة المؤقتة</h1>
        
        <p>نعمل حالياً على تحسين وتطوير المنتدى لنقدم لكم تجربة أفضل. سنعود إليكم في أقرب وقت ممكن. شكراً لتفهمكم وصبركم معنا.</p>
        
        <div class="footer-note">
            إدارة المنتدى
        </div>
    </div>

</body>
</html>

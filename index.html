<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتدى تحت الصيانة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .maintenance-container {
            text-align: center;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }

        .icon {
            font-size: 64px;
            color: #e67e22;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .quote-box {
            border-right: 4px solid #3498db;
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            text-align: right;
            font-style: italic;
        }

        .footer {
            font-size: 14px;
            color: #bdc3c7;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- أيقونة الصيانة (يمكن استبدالها بلوجو المنتدى) -->
        <div class="icon">🛠️</div>
        
        <h1>المنتدى مغلق للصيانة المؤقتة</h1>
        
        <p>نعمل حالياً على تحسين وتطوير المنتدى لنمنحكم تجربة أفضل. لن نغيب طويلاً، سنعود إليكم بحلة جديدة أقوى وأجمل فور انتهاء أعمال التحديث.</p>
        
        <!-- حكمة ملهمة أثناء الانتظار -->
        <div class="quote-box">
            "الذين في أولادهم وبناتهم وعقولهم طاقة على الصبر، هم الذين يتقنون الصنائع."
            <br>
            <small>— الجاحظ</small>
        </div>

        <div class="footer">
            شكراً لتفهمكم وصبركم • إدارة المنتدى
        </div>
    </div>

</body>
</html>

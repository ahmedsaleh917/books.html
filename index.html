// ✅ دالة نسخ النص للحافظة
async function copyPostText(title,content,postId){
    const fullText=`${title}\n\n${content}`;
    try{
        await navigator.clipboard.writeText(fullText);
        showAlert('تم نسخ النص ✨','✅');
        // تغيير أيقونة الزر مؤقتاً
        const btn=document.querySelector(`[data-post-id="${postId}"] .copy-btn`);
        if(btn){
            const originalHTML=btn.innerHTML;
            btn.innerHTML='<i class="fas fa-check"></i> تم';
            btn.style.color='var(--s)';
            setTimeout(()=>{
                btn.innerHTML=originalHTML;
                btn.style.color='#666';
            },2000);
        }
    }catch(err){
        // طريقة بديلة
        const textArea=document.createElement('textarea');
        textArea.value=fullText;        textArea.style.position='fixed';
        textArea.style.left='-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try{
            document.execCommand('copy');
            showAlert('تم نسخ النص ✨','✅');
        }catch(e){
            showAlert('فشل النسخ','❌');
        }
        document.body.removeChild(textArea);    }
}
// ✅ دالة تحميل المنتدى المحسّنة
async function lfm(){
    const pl=document.getElementById('pl');
    const ts=document.getElementById('ts');
    
    try{
        pl.innerHTML='<div class="ld"><i class="fas fa-spinner"></i><p>جاري التحميل...</p></div>';
        
        const snapshot=await firebase.database().ref('posts').orderByChild('timestamp').once('value');
        let posts=[];
        
        snapshot.forEach(child=>{
            const data=child.val();
            if(data){
                posts.push({id:child.key,...data});
            }
        });
        
        // ترتيب تنازلي (الأحدث أولاً)
        posts.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
        
        const trending=posts.filter(p=>(p.likeCount||0)>=200);
        const normal=posts.filter(p=>(p.likeCount||0)<200);
        
        // عرض المحتوى الرائج
        if(trending.length>0){
            let html='<div class="tb"><div class="th"><i class="fas fa-fire"></i> المحتوى الرائج <span class="tba">200+ إعجاب</span></div>';
            trending.forEach(p=>html+=mp(p,true));
            html+='</div>';
            ts.innerHTML=html;
        }else{
            ts.innerHTML='';
        }
        
        // عرض المنشورات العادية
        if(normal.length>0){
            pl.innerHTML=normal.map(p=>mp(p)).join('');
        }else{            pl.innerHTML='<div class="em"><i class="fas fa-inbox"></i><h3>لا توجد مشاركات</h3><p>كن أول من يشارك</p></div>';
        }
        
    }catch(err){
        console.error('LoadPosts Error:',err);
        pl.innerHTML='<div class="em" style="color:var(--r)"><i class="fas fa-exclamation-triangle"></i><h3>خطأ في التحميل</h3><p>'+err.message+'</p></div>';
    }
}
// ✅ دالة عرض المنشور مع زر النسخ
function mp(p,rt=false){
    const liked=p.likes&&u&&p.likes[u.uid];
    const lc=p.likeCount||0;    const cc=p.commentCount||0;
    const avatar=p.authorPhoto?`<img src="${p.authorPhoto}">`:'<i class="fas fa-user"></i>';
    const content=p.content||'';
    const isLong=content.length>200;
    const display=isLong?content.substring(0,200)+'...':content;
    
    // ✅ هروب الأحرف الخاصة للنسخ
    const escapedContent=content.replace(/'/g,"\\'").replace(/"/g,'"').replace(/\n/g,'\\n');
    const escapedTitle=(p.title||'').replace(/'/g,"\\'").replace(/"/g,'"');
    
    return`<div class="pc" data-id="${p.id}">${rt?'<div style="position:absolute;top:10px;left:10px;background:var(--r);color:#fff;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700">🔥 رائج</div>':''}
    <div class="ph"><div class="ua ${p.authorPhoto?'':'p'}">${avatar}</div><div class="ui"><div class="un">${p.authorName||'عضو'}</div><div class="ut">${ta(p.timestamp)}</div></div></div>
    <div class="pt">${p.title}</div><div class="pco ${isLong?'t':''}" id="c-${p.id}">${display}</div>
    ${isLong?`<button class="rm" onclick="trm('${p.id}')">قراءة المزيد</button>`:''}
    <div class="pa">
        <button class="abn ${liked?'l':''}" onclick="tlk('${p.id}')"><i class="${liked?'fas':'far'} fa-heart"></i> <span>${lc}</span></button>
        <button class="abn" onclick="tcm('${p.id}')"><i class="far fa-comment"></i> <span>${cc}</span></button>
        <button class="abn copy-btn" onclick="copyPostText('${escapedTitle}','${escapedContent}','${p.id}')"><i class="far fa-copy"></i> نسخ</button>
        ${u&&u.uid!==p.authorId?`<button class="abn rp" onclick="rpt('${p.id}')"><i class="fas fa-flag"></i> بلاغ</button>`:''}
        ${(isOwner||isMod)?`<button class="abn dl" onclick="dlt('${p.id}')"><i class="fas fa-trash"></i> حذف</button>`:''}
    </div>
    <div class="cs" id="cm-${p.id}"><div class="ciw"><input class="ci" id="ci-${p.id}" placeholder="تعليق..." onkeypress="if(event.key==='Enter')acm('${p.id}')"><button class="csb" onclick="acm('${p.id}')"><i class="fas fa-paper-plane"></i></button></div><div id="cl-${p.id}"></div></div></div>`;
}

function trm(id){const el=document.getElementById('c-'+id),btn=el.nextElementSibling;if(el.classList.contains('t')){el.classList.remove('t');btn.textContent='عرض أقل';}else{el.classList.add('t');btn.textContent='قراءة المزيد';}}

function tlk(id){if(!u)return nav('au');const pr=firebase.database().ref('posts/'+id),lr=pr.child('likes/'+u.uid);lr.once('value').then(s=>{if(s.exists()){lr.remove();pr.child('likeCount').transaction(c=>(c||1)-1);}else{lr.set({t:Date.now()});pr.child('likeCount').transaction(c=>(c||0)+1);}setTimeout(lfm,600);});}

function tcm(id){const sec=document.getElementById('cm-'+id);sec.classList.toggle('o');if(sec.classList.contains('o'))lcm(id);}

function lcm(id){const el=document.getElementById('cl-'+id);firebase.database().ref('posts/'+id+'/comments').orderByChild('timestamp').once('value').then(s=>{let h='';s.forEach(ch=>{const c=ch.val();h+=`<div class="cit"><div class="ch"><span class="ca">${c.authorName||'عضو'}</span><span class="ct">${ta(c.timestamp)}</span></div><div class="ctx">${c.text}</div></div>`;});el.innerHTML=h||'<div style="text-align:center;color:#666;padding:10px">لا توجد تعليقات</div>';});}

function acm(id){if(!u)return nav('au');const inp=document.getElementById('ci-'+id),txt=inp.value.trim();if(!txt)return;firebase.database().ref('posts/'+id+'/comments').push({text:txt,authorId:u.uid,authorName:ud?ud.fullname:'عضو',timestamp:Date.now()}).then(()=>{firebase.database().ref('posts/'+id+'/commentCount').transaction(c=>(c||0)+1);inp.value='';lcm(id);});}
function rpt(id){if(!u)return nav('au');showConfirm('هل تريد الإبلاغ؟',()=>{firebase.database().ref('reports').push({postId:id,reporterId:u.uid,reporterName:ud?ud.fullname:'عضو',timestamp:Date.now(),status:'pending'}).then(()=>showAlert('تم إرسال البلاغ','✅'));});}

        const postsSnap=await firebase.database().ref('posts').orderByChild('authorId').equalTo(u.uid).once('value');

// ✅ دالة معالجة الصورة المختارة - محسّنة
function prevEditPhoto(inp){
    console.log('📸 Photo input changed:',inp.files);
    
    if(inp.files&&inp.files[0]){
        editImg=inp.files[0];
        console.log('✅ File selected:',editImg.name,editImg.type,editImg.size);
        
        // التحقق من نوع الملف
        if(!editImg.type.startsWith('image/')){
            showAlert('يرجى اختيار صورة فقط','⚠️');
            editImg=null;
            return;
        }
        
        const r=new FileReader();
        r.onload=e=>{
            document.getElementById('ed-img').src=e.target.result;
            document.getElementById('ed-prev').classList.add('s');
            console.log('✅ Preview loaded');
        };
        r.onerror=err=>{
            console.error('❌ FileReader error:',err);
            showAlert('خطأ في قراءة الصورة','❌');
        };
        r.readAsDataURL(inp.files[0]);    }else{        console.log('⚠️ No file selected');
    }
}

function editPhoto(){
    if(!u){
        showAlert('يجب تسجيل الدخول أولاً','⚠️');        return;
    }
    
    console.log('📷 editPhoto clicked');
    
    let fileInput=document.getElementById('ed-photo');
    
    if(!fileInput){
        console.log('🔧 Creating file input element');
        fileInput=document.createElement('input');

// ✅ دالة حفظ البروفايل - محسّنة مع ImgBB
async function saveProfile(){
    const name=document.getElementById('ed-name').value.trim();
    const age=document.getElementById('ed-age').value;
    const gender=document.getElementById('ed-gender').value;
    
    if(!name||!age||!gender){showAlert('أكمل جميع الحقول','⚠️');return;}
    
    const btn=document.getElementById('ed-save');
    btn.disabled=true;
    btn.textContent='جاري الحفظ...';
    
    try{
        let photoURL=(ud&&ud.photoURL)?ud.photoURL:null;
        
        if(editImg){
            console.log('📤 Uploading to ImgBB...');
            showAlert('جاري رفع الصورة...','ℹ️');            
            // ✅ رفع الصورة إلى ImgBB
            const formData=new FormData();
            formData.append('image',editImg);
            
            const response=await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_API_KEY}`,{
                method:'POST',                body:formData
            });
            
            const data=await response.json();
            
            if(data.success){
                photoURL=data.data.url;
                console.log('✅ Photo uploaded to ImgBB:',photoURL);
            }else{
                throw new Error('فشل رفع الصورة');
            }
        }
        
        const updates={
            fullname:name,
            age:parseInt(age),
            gender:gender,
            photoURL:photoURL,
            updatedAt:Date.now()
        };
        
        // إزالة القيم undefined
        Object.keys(updates).forEach(key=>{
            if(updates[key]===undefined)delete updates[key];
        });
        
        await firebase.database().ref('users/'+u.uid).update(updates);
        
        // تحديث البيانات المحلية
        if(!ud)ud={};
        ud.fullname=name;
        ud.age=parseInt(age);
        ud.gender=gender;
        if(photoURL)ud.photoURL=photoURL;
        
        closeEdit();
        await lpr();
        showAlert('تم الحفظ بنجاح ✨','✅');
        
    }catch(er){
        console.error('❌ SaveErr:',er);
        showAlert('خطأ: '+er.message,'❌');
    }finally{
        btn.disabled=false;        btn.textContent='💾 حفظ التغييرات';
    }
}

// Admin Functions
async function lad(){if(!isOwner&&!isMod)return nav('fm');const uSn=await firebase.database().ref('users').once('value'),pSn=await firebase.database().ref('posts').once('value'),rSn=await firebase.database().ref('reports').once('value');let uc=0,mc=0;uSn.forEach(ch=>{uc++;if(ch.val().isModerator)mc++;});let rc=0;rSn.forEach(ch=>{if(ch.val().status==='pending')rc++;});document.getElementById('au').textContent=uc;document.getElementById('ap').textContent=pSn.size;document.getElementById('ar').textContent=rc;document.getElementById('am').textContent=mc;lrp();lus();lmd();}function adt(t){document.querySelectorAll('.atb2').forEach(b=>b.classList.remove('a'));document.querySelectorAll('.ase').forEach(s=>s.classList.remove('a'));event.target.classList.add('a');document.getElementById('ad-'+t).classList.add('a');}
async function lrp(){const el=document.getElementById('ad-rp'),sn=await firebase.database().ref('reports').orderByChild('timestamp').once('value');let h='';sn.forEach(ch=>{const r=ch.val(),st=r.status==='pending'?'<span style="color:#f39c12">معلق</span>':'<span style="color:#27ae60">تم الحل</span>';h+=`<div class="ac"><div class="ai"><div class="an">${r.reporterName||'مجهول'} ${st}</div><div class="ae">منشور: ${r.postId}</div><div class="ad">${new Date(r.timestamp).toLocaleString('ar-SA')}</div></div>${r.status==='pending'?`<button class="bsm bsd" onclick="drp('${r.postId}','${ch.key}')">حذف</button><button class="bsm bss" onclick="rrp('${ch.key}')">حل</button>`:''}</div>`;});el.innerHTML=h||'<div class="em"><i class="fas fa-check-circle"></i><h3>لا توجد بلاغات</h3></div>';}
async function lus(){const el=document.getElementById('ad-us'),sn=await firebase.database().ref('users').once('value');let h='';sn.forEach(ch=>{const us=ch.val(),uid=ch.key;let bg='';if(us.isAdmin)bg+='<span class="bd bda">مدير</span>';if(us.isModerator)bg+='<span class="bd bdm">مشرف</span>';if(us.isBanned)bg+='<span class="bd" style="background:#555">محظور</span>';const av=us.photoURL?`<img src="${us.photoURL}">`:'<i class="fas fa-user"></i>';h+=`<div class="ac"><div class="aav ${us.photoURL?'':'p'}">${av}</div><div class="ai"><div class="an">${us.fullname} ${bg}</div><div class="ae">${us.email}</div><div class="ad">${us.gender==='male'?'ذكر':'أنثى'} | ${us.age} سنة</div></div>${isOwner&&uid!==u.uid?`<button class="bsm ${us.isBanned?'bss':'bsd'}" onclick="tgb('${uid}',${!us.isBanned})">${us.isBanned?'فك حظر':'حظر'}</button>`:''}</div>`;});el.innerHTML=h;}
async function lmd(){const el=document.getElementById('ad-md'),sn=await firebase.database().ref('users').orderByChild('isModerator').equalTo(true).once('value');let h='';sn.forEach(ch=>{const us=ch.val(),uid=ch.key;const av=us.photoURL?`<img src="${us.photoURL}">`:'<i class="fas fa-user"></i>';h+=`<div class="ac"><div class="aav ${us.photoURL?'':'p'}">${av}</div><div class="ai"><div class="an">${us.fullname}</div><div class="ae">${us.email}</div></div>${isOwner?`<button class="bsm bsw" onclick="rmd('${uid}')">إزالة</button>`:''}</div>`;});if(isOwner)h+=`<div style="margin-top:20px;padding:15px;background:#0a0a0a;border-radius:12px;display:flex;gap:10px;flex-wrap:wrap"><input type="email" id="nmd" placeholder="بريد المشرف" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--b);background:#111;color:#fff;min-width:150px"><button class="bsm bsi" onclick="amd()">تعيين</button></div>`;el.innerHTML=h||'<div class="em"><i class="fas fa-user-shield"></i><h3>لا يوجد مشرفين</h3></div>';}
async function drp(pid,rid){showConfirm('حذف المنشور وحل البلاغ؟',()=>{firebase.database().ref('posts/'+pid).remove();firebase.database().ref('reports/'+rid).update({status:'resolved'});lad();showAlert('تم الحذف','✅');});}async function rrp(rid){firebase.database().ref('reports/'+rid).update({status:'resolved'});lad();showAlert('تم الحل','✅');}
async function tgb(uid,ban){if(!isOwner)return;const msg=ban?'حظر':'فك حظر';showConfirm('هل تريد '+msg+' هذا المستخدم؟',()=>{firebase.database().ref('users/'+uid).update({isBanned:ban}).then(()=>{lad();showAlert('تم '+msg,'✅');});});}
async function amd(){if(!isOwner){showAlert('ليس لديك صلاحية','❌');return;}const em=document.getElementById('nmd').value.trim();if(!em){showAlert('أدخل البريد','⚠️');return;}const sn=await firebase.database().ref('users').orderByChild('email').equalTo(em).once('value');if(!sn.exists()){showAlert('المستخدم غير موجود','❌');return;}let uid='';sn.forEach(ch=>uid=ch.key);firebase.database().ref('users/'+uid).update({isModerator:true,role:'moderator'}).then(()=>{showAlert('تم التعيين','✅');lad();});}
async function rmd(uid){if(!isOwner)return;showConfirm('إزالة من الإشراف؟',()=>{firebase.database().ref('users/'+uid).update({isModerator:false,role:'user'}).then(()=>{lad();showAlert('تمت الإزالة','✅');});});}

<script>// ⚡ السكريبت الذكي للتحقق من الإنترنت
const GITHUB_URL = 'https://ahmedsaleh917.github.io/books.html/';

async function checkInternet(){
    try{
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch(GITHUB_URL + '?t=' + Date.now(), {
            method: 'HEAD',
            signal: controller.signal,
            cache: 'no-store'
        });
        
        clearTimeout(timeoutId);
        return response.ok;
    }catch(e){
        return false;
    }
}

function showOnline(){
    document.getElementById('connection-checker').classList.add('hidden');
    document.getElementById('online-frame').style.display = 'block';
    document.getElementById('online-frame').src = GITHUB_URL;
    document.getElementById('status-text').textContent = '✅ تم الاتصال - جاري التحميل...';
}

function showOffline(){
    document.getElementById('connection-checker').classList.add('hidden');
    document.getElementById('offline-content').classList.remove('hidden');
}

window.addEventListener('load', async function(){
    const isOnline = await checkInternet();
    
    if(isOnline){
        showOnline();
    }else{
        showOffline();
    }
});

window.addEventListener('online', function(){
    if(confirm('🌐 تم استعادة الاتصال!\nهل تريد التحديث للنسخة الأونلاين؟')){
